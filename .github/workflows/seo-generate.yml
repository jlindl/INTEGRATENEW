name: SEO generate

# Writes the day's two blog posts. Articles only: nothing is posted to social media.
#
# GitHub cron runs in UTC: 05:00 UTC is 06:00 UK in summer (BST) and 05:00 UK
# in winter (GMT), so it's early morning either way. Re-running on the same
# day is safe: post types already generated that day are skipped.
#
# PUBLISH_MODE (repository variable, default "pr"):
#   pr    Posts are added to one rolling pull request (branch seo/pending-posts).
#         Nothing goes live until you merge it. While that PR is open, each
#         day's posts are added to it, so the ledger stays continuous and
#         topics can't repeat.
#   auto  Posts are committed straight to main and go live on the next deploy.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Which posts to generate
        type: choice
        options: [both, location, service]
        default: both

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: seo-generate
  cancel-in-progress: false

env:
  PENDING_BRANCH: seo/pending-posts

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SITE_URL: ${{ secrets.SITE_URL || 'https://www.integrate-tech.co.uk' }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'pr' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ONLY: ${{ inputs.only || 'both' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Git identity and issue label
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh label create seo-engine --color 0E8A16 --description "Opened by the SEO engine" --force

      - name: Continue the open pending-posts PR
        if: env.PUBLISH_MODE == 'pr'
        run: |
          pr=$(gh pr list --head "$PENDING_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            echo "Adding today's posts to open PR #$pr"
            git fetch origin "$PENDING_BRANCH"
            git checkout -B "$PENDING_BRANCH" "origin/$PENDING_BRANCH"
            git merge --no-edit origin/main
            echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"
          else
            echo "No open PR; starting a fresh branch from main"
            git checkout -B "$PENDING_BRANCH"
            echo "FRESH_BRANCH=true" >> "$GITHUB_ENV"
          fi

      - name: Generate posts
        run: |
          if [ "$ONLY" = "both" ]; then npm run seo:generate; else npm run seo:generate -- --only "$ONLY"; fi

      - name: Commit
        id: commit
        run: |
          git add content/blog seo-engine/data/ledger.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "SEO engine: posts for $(TZ=Europe/London date +%F)"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH_MODE" = "auto" ]; then
            # Pick up anything pushed to main while the posts were being written.
            git pull --rebase origin main
            git push origin HEAD:main
          elif [ "${FRESH_BRANCH:-}" = "true" ]; then
            # Replaces a leftover branch from a merged or closed PR.
            git push --force origin "HEAD:refs/heads/$PENDING_BRANCH"
          else
            git push origin "HEAD:refs/heads/$PENDING_BRANCH"
          fi

      - name: Open or update the review PR
        # Only when this run committed something, or there's an open PR to refresh.
        if: env.PUBLISH_MODE == 'pr' && (steps.commit.outputs.committed == 'true' || env.PR_NUMBER != '')
        run: |
          npx tsx seo-engine/pr-body.ts --base origin/main --log "seo-engine/logs/generate-$(TZ=Europe/London date +%F).json" > "$RUNNER_TEMP/pr-body.md"
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$PENDING_BRANCH" \
              --title "SEO engine: new blog posts to review" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --label seo-engine
          fi

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-generate-log
          path: seo-engine/logs/
          if-no-files-found: ignore

      - name: Report a failed run
        if: failure()
        run: |
          gh issue create --label seo-engine \
            --title "SEO engine: daily generation failed ($(TZ=Europe/London date +%F))" \
            --body "The generate run stopped before finishing. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
